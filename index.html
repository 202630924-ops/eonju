<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐 먹지? 저녁 메뉴 추천</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: #f7f9fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h1 {
            color: #333333;
            font-size: 24px;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #666666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .emoji-display {
            font-size: 80px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
            transition: transform 0.2s ease;
        }

        .menu-name {
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
            height: 35px;
            margin-bottom: 30px;
        }

        .btn {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 107, 107, 0.3);
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn:hover {
            background-color: #ee5253;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* 애니메이션 효과 */
        .bounce {
            animation: bounce 0.4s ease;
        }

        @keyframes bounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>오늘 저녁 뭐 먹지? 🍽️</h1>
        <p class="subtitle">결정이 어렵다면 버튼을 눌러보세요!</p>
        
        <div class="emoji-display" id="emoji">❓</div>
        <div class="menu-name" id="menuName">버튼을 눌러주세요</div>
        
        <button class="btn" onclick="recommendMenu()">저녁메뉴 결정</button>
    </div>

    <script>
        // 저녁 메뉴 리스트 (이모지 및 메뉴 이름)
        const menuList = [
            { emoji: '🍕', name: '피자' },
            { emoji: '🍔', name: '버거' },
            { emoji: '🍗', name: '치킨' },
            { emoji: '🍜', name: '라면/우동' },
            { emoji: '🍣', name: '초밥' },
            { emoji: '🥩', name: '삼겹살/소고기' },
            { emoji: '🍲', name: '찌개/전골' },
            { emoji: '🍛', name: '카레' },
            { emoji: '🍝', name: '파스타' },
            { emoji: '🌮', name: '타코/멕시칸' },
            { emoji: '🥟', name: '만두' },
            { emoji: '🍱', name: '도시락/덮밥' },
            { emoji: '🥗', name: '샐러드' },
            { emoji: '🍚', name: '한식/비빔밥' },
            { emoji: '🍢', name: '분식/떡볶이' }
        ];

        function recommendMenu() {
            const emojiElement = document.getElementById('emoji');
            const menuNameElement = document.getElementById('menuName');

            // 애니메이션 클래스 제거 후 재적용 (효과 반복)
            emojiElement.classList.remove('bounce');
            
            // 짧은 로딩 효과를 위해 슬롯머신처럼 이모지가 빠르게 변하는 효과
            let count = 0;
            const timer = setInterval(() => {
                const randomTemp = menuList[Math.floor(Math.random() * menuList.length)];
                emojiElement.textContent = randomTemp.emoji;
                menuNameElement.textContent = '추천 중...';
                count++;

                if (count > 10) {
                    clearInterval(timer);
                    // 최종 결정
                    const finalMenu = menuList[Math.floor(Math.random() * menuList.length)];
                    emojiElement.textContent = finalMenu.emoji;
                    menuNameElement.textContent = finalMenu.name;
                    emojiElement.classList.add('bounce');
                }
            }, 50);
        }
    </script>

</body>
</html>
